# 多游戏社区签到配置
# 复制为 config.yaml 填写。运行后自动生成 credentials.json 存储凭据。
# 两个文件都含敏感信息，请勿提交（.gitignore 已忽略）。

debug: false

accounts:
  - name: "米游社主号"
    platform: mihoyo
    games: ["zzz", "genshin"]
    # 凭证二选一：手动抓包 cookie + stoken，或配置账密自动登录
    cookie: ""             # APP 抓包获取（含 cookie_token_v2 等 v2 字段）
    stoken: ""             # 社区接口必需（v2_ 开头）
    phone: ""              # 手机号（配置后凭证过期可自动重新登录并刷新 cookie）
    password: ""           # 密码
    # 设备标识（可选，强烈建议固定复用以降低风控验证码概率）：
    # 从抓包请求头 x-rpc-device_id / x-rpc-device_fp 获取；不填则首次生成
    # 并持久化到 credentials.json
    device_id: ""
    device_fp: ""

  - name: "鸣潮主号"
    platform: kuro
    token: ""              # APP 抓包或网页登录获取（JWT，有效期约30天）
                           # 网页登录：打开 https://www.kurobbs.com/mc/home/9 ，
                           # 手机验证码登录后在浏览器 localStorage 取 auth_token 值

  - name: "异环主号"
    platform: tajiduo
    phone: ""              # 手机号
    password: ""           # 密码（程序自动登录并管理 token）

  - name: "森空岛主号"
    platform: skland
    phone: ""              # 手机号（鹰角通行证）
    password: ""           # 密码（程序自动登录并管理 token）
